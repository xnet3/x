<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xfeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body.light{--bg:#fff;--bg2:#f6f7f9;--bg3:#eceff4;--bg4:#dbe0e8;--txt:#14161b;--txt2:#4c5464;--txt3:#868d9b;--border:#e5e8ee;--shadow:rgba(16,24,40,.12);--surface:#fff;--raised:0 1px 2px rgba(16,24,40,.07);--topbar:rgba(255,255,255,.86);--tint:rgba(0,0,0,.07);--red:#14161b;--red2:#3a3f4a;--onred:#fff}
body.dark{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#262628;--bg4:#3c3c40;--txt:#f2f2f3;--txt2:#a9adb5;--txt3:#76797f;--border:rgba(255,255,255,.09);--shadow:rgba(0,0,0,.55);--surface:#181819;--raised:0 1px 2px rgba(0,0,0,.45);--topbar:rgba(15,15,15,.86);--tint:rgba(255,255,255,.12);--red:#f2f2f3;--red2:#cfd1d6;--onred:#0f0f0f}
:root{--sw:240px;--sc:72px;--th:76px;--ease:.2s cubic-bezier(.4,0,.2,1);--font:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
button,input,textarea{font-family:var(--font);color:inherit}
body{background:var(--bg);color:var(--txt);font-family:var(--font);overflow-x:hidden;min-height:100vh;transition:background .2s,color .2s}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* topbar */
#topbar{position:fixed;top:12px;left:0;right:0;margin:0 auto;width:min(1080px,calc(100% - 32px));height:52px;background:var(--topbar);display:flex;align-items:center;padding:0 12px;gap:10px;z-index:200;border:1px solid var(--border);border-radius:999px;box-shadow:0 6px 24px var(--shadow);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
.tbtn{background:none;border:none;cursor:pointer;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--ease)}
.tbtn:hover{background:var(--bg3)}
.tbtn svg{width:22px;height:22px;fill:currentColor}
#logo{font-size:23px;font-weight:800;letter-spacing:-.04em;cursor:pointer;direction:ltr;flex-shrink:0}
#logo i{font-style:normal;color:var(--txt3)}
.tb-r{display:flex;align-items:center;gap:10px;margin-inline-start:auto;flex-shrink:0}
.tb-actions{display:flex;align-items:center;height:40px;padding:3px;border:1px solid var(--border);border-radius:999px;background:var(--bg2)}
.tb-actions .tbtn{width:32px;height:32px;color:var(--txt2)}
.tb-actions .tbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tb-actions .ic-sun{display:none}body.dark .tb-actions .ic-sun{display:block}body.dark .tb-actions .ic-moon{display:none}
.search-wrap{display:flex;flex:1;max-width:560px;margin:0 24px;min-width:0}
.search-box{display:flex;align-items:center;flex:1;height:40px;padding:3px 14px;border:1px solid var(--border);border-radius:999px;background:var(--bg2);transition:border-color var(--ease),background var(--ease),box-shadow var(--ease)}
.search-box:focus-within{background:var(--bg);border-color:var(--bg4);box-shadow:0 0 0 4px var(--tint)}
.search-box input{flex:1;min-width:0;height:100%;background:transparent;border:none;font-size:14px;outline:none}
.search-box input::placeholder{color:var(--txt3)}
@media(max-width:900px){.search-wrap{display:none}}
.yt-login-btn{height:40px;padding-inline:4px 16px;gap:9px;border-radius:999px;border:none;background:var(--txt);color:var(--bg);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center}
.yt-login-btn:hover{background:var(--txt2)}
.g-dot{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
.g-dot svg{width:16px;height:16px}
.yt-user-chip{display:flex;align-items:center;gap:8px;height:40px;padding:3px 3px 3px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;cursor:pointer;transition:background var(--ease)}
.yt-user-chip:hover{background:var(--bg3)}
.yt-user-name{font-size:13px;font-weight:500;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){.yt-user-name,.lbl{display:none}.yt-user-chip{padding-left:3px}.yt-login-btn{padding-inline-end:4px}}
#user-menu{position:fixed;top:calc(var(--th) + 8px);left:12px;width:220px;background:var(--bg2);border:1px solid var(--bg4);border-radius:12px;box-shadow:0 8px 32px var(--shadow);z-index:300;padding:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(-8px)}
#user-menu.open{opacity:1;pointer-events:all;transform:none}
.um-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.um-item:hover{background:var(--bg3)}
.um-item svg{width:17px;height:17px;fill:currentColor}

/* sidebar: floating icon rail */
#sidebar{position:fixed;top:50%;right:16px;transform:translateY(-50%);width:58px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:30px;box-shadow:0 6px 24px var(--shadow);z-index:100}
.nitem{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--txt2);transition:background var(--ease),color var(--ease)}
.nitem:hover{background:var(--bg3);color:var(--txt)}
.nitem.on{background:var(--red);color:var(--onred)}
.ni{display:flex}.ni svg{width:20px;height:20px;fill:currentColor}
.nl{position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);background:var(--txt);color:var(--bg);font-size:12px;font-weight:500;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.nitem:hover .nl{opacity:1}
.sb-div{height:1px;background:var(--border);margin:4px 8px}
#main{margin:var(--th) 90px 0 0;padding:26px 30px 64px;min-height:calc(100vh - var(--th))}
@media(max-width:760px){:root{--th:72px}#sidebar{top:auto;bottom:12px;right:12px;left:12px;transform:none;width:auto;flex-direction:row;justify-content:space-around;padding:6px 10px;border-radius:999px}.nl,.sb-div{display:none}#main{margin-right:0;padding:16px 16px 100px}}

/* feed (נלקח מהפיד של MyTube) */
.feed{max-width:470px;margin:0 auto}
.feed-head{margin-bottom:18px;padding:0 4px}
.feed-head h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.feed-head p{font-size:12.5px;color:var(--txt3);margin-top:4px}
.fpost{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px 14px 10px;margin-bottom:14px;box-shadow:var(--raised)}
.fp-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.vav{width:38px;height:38px;border-radius:50%;flex-shrink:0;overflow:hidden;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--bg4)}
.vav img,.yt-user-av{width:100%;height:100%;object-fit:cover}
.yt-user-chip .vav{width:32px;height:32px;box-shadow:none;cursor:inherit}
.fp-who{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.fp-name{font-size:14px;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.fp-name:hover{text-decoration:underline}
.fp-time{font-size:11.5px;color:var(--txt3)}
.fp-title{font-size:14.5px;font-weight:500;line-height:1.6;margin-bottom:11px;padding:0 2px;white-space:pre-wrap;overflow-wrap:anywhere}
.fmedia{position:relative;width:100%;background:var(--bg3);border-radius:16px;overflow:hidden;margin-bottom:2px}
.fmedia img{width:100%;max-height:560px;object-fit:cover;display:block}
.fp-actions{display:flex;align-items:center;gap:2px;margin-top:8px}
.sp{flex:1}
.lc{font-size:12.5px;color:var(--txt3);min-width:8px}
.fbtn{width:34px;height:34px;border-radius:50%;background:transparent;color:var(--txt2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,transform .15s}
.fbtn:hover{background:var(--bg3);color:var(--txt)}
.fbtn:active{transform:scale(.88)}
.fbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.like-btn.on{color:var(--red)}.like-btn.on svg{fill:var(--red);stroke:var(--red)}
.feed-end{text-align:center;color:var(--txt3);font-size:12.5px;padding:16px 0 40px;min-height:60px}
.feed-spin{width:24px;height:24px;margin:0 auto 8px;border-radius:50%;border:3px solid var(--bg4);border-top-color:var(--red);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 37%,var(--bg3) 63%);background-size:400% 100%;animation:sh 1.4s infinite;border-radius:22px;height:230px;margin-bottom:14px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

/* composer */
.cmp textarea{width:100%;background:transparent;border:none;outline:none;resize:none;font-size:14.5px;line-height:1.6;padding:0 2px;margin-bottom:6px}
.cmp textarea::placeholder{color:var(--txt3)}
.rm{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rm svg{width:14px;height:14px;fill:currentColor}
.sbtn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:background var(--ease),transform .15s}
.sbtn:hover{background:var(--bg3)}.sbtn:active{transform:scale(.98)}.sbtn:disabled{opacity:.5;pointer-events:none}
.sbtn-main{background:var(--red);border-color:var(--red);color:var(--onred)}.sbtn-main:hover{background:var(--red2)}

/* channels */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-width:1000px;margin:0 auto}
.ccard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:14px;box-shadow:var(--raised)}
.cbio{font-size:12.5px;color:var(--txt2);margin-top:4px;overflow-wrap:anywhere}
.chead{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding:0 4px}
.chead .vav{width:64px;height:64px;font-size:20px}
.chead h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:80px 20px;color:var(--txt2)}
.empty h3{font-size:17px;font-weight:700;margin-bottom:8px;color:var(--txt)}
.empty p{font-size:13px;color:var(--txt3);max-width:340px;line-height:1.6;margin-bottom:18px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.mbox h3{font-size:17px;font-weight:700}
.mbox input,.mbox textarea{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;resize:none}
.mbox input:focus,.mbox textarea:focus{border-color:var(--bg4);box-shadow:0 0 0 4px var(--tint)}
.mrow{display:flex;gap:8px;justify-content:flex-start}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--bg4);color:var(--txt);padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:600;box-shadow:0 4px 20px var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .35s,visibility .35s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-logo{font-size:46px;font-weight:700;letter-spacing:-1px;color:var(--txt);animation:spPulse 1.4s ease-in-out infinite}
#splash .sp-logo i{font-style:normal;color:var(--red)}
#splash .sp-bar{width:150px;height:4px;border-radius:4px;background:var(--bg3);overflow:hidden;position:relative}
#splash .sp-bar::after{content:'';position:absolute;top:0;bottom:0;width:45%;border-radius:4px;background:var(--red);animation:spBar 1.1s ease-in-out infinite}
#splash .sp-txt{font-size:13px;color:var(--txt3);min-height:18px}
@keyframes spPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.75}}
@keyframes spBar{0%{left:-45%}100%{left:100%}}
.edbox{margin-bottom:11px}
.edbox textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.6;outline:none;resize:vertical;min-height:84px}
.edbox textarea:focus{border-color:var(--bg4);box-shadow:0 0 0 4px var(--tint)}
.edbar{display:flex;gap:8px;justify-content:flex-start;margin-top:8px}
.edtag{color:var(--txt3)}
.pm-wrap{position:relative}
.pmenu{position:absolute;left:0;top:calc(100% + 4px);min-width:170px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 28px var(--shadow);padding:6px;display:none;z-index:30}
.pmenu.open{display:block}
.pmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:none;border:none;border-radius:9px;color:var(--txt);font-size:13.5px;cursor:pointer;text-align:start}
.pmenu button:hover{background:var(--bg2)}
.pmenu button.danger{color:var(--red)}
.pmenu svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* home */
.home{max-width:760px;margin:0 auto}
.home>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.home>*:nth-child(2){animation-delay:.08s}.home>*:nth-child(3){animation-delay:.14s}.home>*:nth-child(4){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:32px;padding:46px 34px 26px;margin-bottom:34px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--raised)}
.hero-bg{position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero-bg i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.42;animation:float 15s ease-in-out infinite}
body.light .hero-bg i{opacity:.28}
.hero-bg i:nth-child(1){width:320px;height:320px;background:#7c5cff;top:-120px;right:-80px}
.hero-bg i:nth-child(2){width:280px;height:280px;background:#ff6a88;bottom:-130px;left:-60px;animation-delay:-5s}
.hero-bg i:nth-child(3){width:220px;height:220px;background:#22d3ee;top:25%;left:38%;animation-delay:-10s;opacity:.22}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(34px,-26px) scale(1.14)}}
.hpill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--txt2);background:var(--bg2);border:1px solid var(--border);padding:6px 13px;border-radius:999px;margin-bottom:18px}
.hdot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%,100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
.hero h1{font-size:clamp(30px,6vw,48px);font-weight:800;letter-spacing:-1.2px;line-height:1.12;margin-bottom:14px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#7c5cff,#ff6a88,#22d3ee,#7c5cff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 7s linear infinite}
@keyframes grad{to{background-position:-250% 0}}
.hsub{font-size:15px;line-height:1.7;color:var(--txt2);max-width:520px;margin-bottom:22px}
.hcta{display:flex;gap:10px;flex-wrap:wrap}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid var(--border)}
.hstats b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hstats span{font-size:12.5px;color:var(--txt3)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}
.sec-h h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sec-h a{font-size:12.5px;color:var(--txt2);cursor:pointer}.sec-h a:hover{color:var(--txt)}
#hch,#htr{margin-bottom:30px}#hch:empty,#htr:empty{display:none}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 4px 14px;margin:0 -4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .skel{flex:0 0 184px;height:190px;margin:0}
.hch{flex:0 0 184px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px 14px 16px;box-shadow:var(--raised);transition:transform .2s,box-shadow .2s}
.hch:hover{transform:translateY(-4px);box-shadow:0 12px 28px var(--shadow)}
.hch .vav{width:60px;height:60px;font-size:18px;margin-bottom:4px}
.hch .fp-name{max-width:100%}
.hch .cbio{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 6px}
.hch .sbtn{margin-top:auto;padding:7px 18px;font-size:12.5px}
.trend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tcard{cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px 16px;box-shadow:var(--raised);display:flex;flex-direction:column;gap:8px;transition:transform .2s}
.tcard:hover{transform:translateY(-3px)}
.tl{font-size:12px;font-weight:700;color:#ff4d6d}
.tt{font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.fpost.flash{animation:flash 1.5s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--txt)}100%{box-shadow:var(--raised)}}
@media(max-width:640px){.hero{padding:32px 20px 20px;border-radius:26px}}

/* post tools + video */
.fmtb{display:inline-flex;align-items:center;gap:1px;margin-inline-start:4px;padding-inline-start:6px;border-inline-start:1px solid var(--border)}
.fbtn.tx{font-size:14px;font-weight:700;font-family:var(--font)}
.vrow{margin:0 0 8px}
.vrow input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:9px 14px;font-size:13.5px;outline:none}
.vrow input:focus{border-color:var(--bg4);box-shadow:0 0 0 4px var(--tint)}
.vhint{font-size:11.5px;color:var(--txt3);margin:5px 4px 0;min-height:14px}.vhint.ok{color:#22a559}.vhint.bad{color:#e5484d}
.edbar .sp{flex:1}
.vid{aspect-ratio:16/9;background:#000;margin-top:8px}
.vid iframe,.vid video{width:100%;height:100%;border:0;display:block}
.vph{cursor:pointer;display:flex;align-items:center;justify-content:center}
.vph.drive{background:linear-gradient(135deg,#1f2937,#111827)}
.vph img{width:100%;height:100%;max-height:none;object-fit:cover;opacity:.92;transition:opacity .2s,transform .3s}
.vph:hover img{opacity:1;transform:scale(1.03)}
.vplay{position:absolute;width:62px;height:62px;border-radius:50%;border:none;background:rgba(0,0,0,.68);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none;backdrop-filter:blur(4px)}
.vplay svg{width:28px;height:28px}
.vtag{position:absolute;bottom:10px;right:12px;font-size:11.5px;color:#cbd5e1}
.vlink{display:block;margin:6px 2px 4px;font-size:13px;color:var(--txt2);overflow-wrap:anywhere;direction:ltr;text-align:left}
.fp-title a{color:inherit;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
</style>
</head>
<body>
<script>document.body.className=localStorage.getItem('xf_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<script>

<script>
/* ============ CONFIG ============ */
const API = 'https://script.google.com/macros/s/AKfycbwXomzzN8-Mps36nkncrpEFMIcHHdWABATIY7THn2cQ9IpfEslaP_-iKF-lulDVq6Ea/exec';   // ← הדבק כאן את כתובת ה-Web App של האפסקריפט
const CLIENT_ID = '426523025549-7c50rkn7cun4vmm2r802u0ij6egjehtg.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email';
const CLD = { cloud: 'ioecathc', preset: 'website_upload3' };   // ← Cloudinary: cloud name + unsigned upload preset (בהמשך)

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const x = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let _t; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(_t); _t = setTimeout(() => t.classList.remove('show'), 2600); }
function ago(ts) {
  let v = (Date.now() - ts) / 1000, i = 0; const t = [60, 60, 24, 30, 12], n = ['שניות', 'דקות', 'שעות', 'ימים', 'חודשים', 'שנים'];
  for (; i < t.length; i++) { if (v < t[i]) break; v /= t[i]; }
  return `לפני ${Math.max(1, Math.floor(v))} ${n[i]}`;
}
const thumb = u => String(u).replace('/upload/', '/upload/f_auto,q_auto,w_900/');
const I = {
  heart: '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.7 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.3 3.4 4.2 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>',
  pen: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  dots: '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  img: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></svg>',
  video: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg>',
  play: '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M8 5v14l11-7z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
};
const av = u => u && u.picture ? `<img src="${x(u.picture)}" referrerpolicy="no-referrer" alt="">` : x(((u && u.name) || '?').slice(0, 2));

/* ============ STATE ============ */
let tok = null, me = null, view = 'home', cuid = null, posts = [], next = null, busy = false, chans = [], q = '', rid = 0, img = '', io = null;
const rdy = { feed: false, auth: false };
function hideSplash() { const e = $('#splash'); if (e) { e.classList.add('out'); setTimeout(() => e.remove(), 500); } }
function mark(k) { rdy[k] = true; if (rdy.feed && rdy.auth) hideSplash(); }
setTimeout(hideSplash, 9000);   // רשת ביטחון

/* ============ API ============ */
async function api(a, p = {}) {
  if (!API) { toast('חסרה כתובת ה-Web App בקבוע API'); throw 0; }
  let r;
  try { r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ a, token: tok, ...p }) })).json(); }
  catch (e) { toast('שגיאת רשת, נסה שוב'); throw e; }
  if (r.error === 'auth') { dropSession(true); toast('ההתחברות פגה, התחבר שוב'); throw 0; }
  if (r.error) { toast(r.error === 'slow' ? 'רגע, לאט יותר' : 'שגיאה: ' + r.error); throw 0; }
  return r;
}

/* ============ GOOGLE SIGN-IN ============ */
const REDIR = () => location.origin + location.pathname;   // חייב להיות רשום ב-Authorized redirect URIs ב-Google Cloud
const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
const authUrl = o => 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
  client_id: CLIENT_ID, redirect_uri: REDIR(), response_type: 'token', scope: SCOPE, include_granted_scopes: 'true', ...o });

/* התחברות באותו טאב: עוברים רגע לגוגל וחוזרים לכאן עם הטוקן ב-hash */
function signIn() {
  const s = rnd();
  try { sessionStorage.setItem('xf_state', s); sessionStorage.setItem('xf_ret', location.hash || '#/home'); } catch (e) {}
  location.href = authUrl({ state: s });
}
function saveAuth(p) {
  const t = p.get('access_token'); if (!t) return false;
  tok = t;
  localStorage.setItem('xf_tok', JSON.stringify({ tok, exp: Date.now() + (+p.get('expires_in') || 3500) * 1000 }));
  localStorage.setItem('xf_was', '1');
  return true;
}
/* חזרה מגוגל: קוראים את הטוקן מה-hash, מנקים את הכתובת ומחזירים את המשתמש לעמוד שבו היה */
function consumeAuthHash() {
  if (!/[#&](access_token|error)=/.test(location.hash)) return false;
  const p = new URLSearchParams(location.hash.slice(1));
  let ret = '#/home', st = null;
  try { ret = sessionStorage.getItem('xf_ret') || ret; st = sessionStorage.getItem('xf_state'); sessionStorage.removeItem('xf_ret'); sessionStorage.removeItem('xf_state'); } catch (e) {}
  if (!/^#\/[\w\/]*$/.test(ret)) ret = '#/home';
  history.replaceState(null, '', location.pathname + location.search + ret);
  if (!st || p.get('state') !== st) return false;
  if (p.get('error')) { toast('ההתחברות עם Google נכשלה או בוטלה'); return false; }
  return saveAuth(p);
}
function dropSession(keep) {
  const t = tok; tok = null; me = null; localStorage.removeItem('xf_tok'); localStorage.removeItem('xf_me'); if (!keep) localStorage.removeItem('xf_was'); renderAuth();
  if (!keep && t) try { fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(t), { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }).catch(() => {}); } catch (e) {}
}
function signOut() { dropSession(); $('#user-menu').classList.remove('open'); toast('התנתקת'); if (view === 'following' || view === 'liked') go('home'); else render(); }
/* חידוש שקט של הטוקן ב-iframe נסתר (בלי חלון קופץ ובלי לעזוב את הדף) */
function silentLogin() {
  return new Promise(res => {
    const st = rnd(), f = document.createElement('iframe');
    f.style.display = 'none'; f.setAttribute('aria-hidden', 'true');
    let done = false, tm;
    const fin = ok => { if (done) return; done = true; removeEventListener('message', on); clearTimeout(tm); f.remove(); res(ok); };
    const on = e => {
      if (e.origin !== location.origin || e.source !== f.contentWindow || !e.data || !e.data.xfAuth) return;
      const p = new URLSearchParams(String(e.data.xfAuth).slice(1));
      fin(p.get('state') === st && !p.get('error') && saveAuth(p));
    };
    addEventListener('message', on);
    tm = setTimeout(() => fin(false), 6000);
    f.src = authUrl({ prompt: 'none', state: st });
    document.body.appendChild(f);
  });
}
async function start() {
  try { Object.keys(localStorage).forEach(k => { if (k.startsWith('xf_c_')) localStorage.removeItem(k); }); } catch (e) {}
  const fresh = consumeAuthHash();
  let st = null;
  try { st = JSON.parse(localStorage.getItem('xf_tok') || 'null'); } catch (e) {}
  if (st && st.exp > Date.now() + 60000) tok = st.tok;
  else if (localStorage.getItem('xf_was')) { $('#sp-txt').textContent = 'בודק התחברות עם Google…'; await silentLogin(); }
  if (tok) { try { me = JSON.parse(localStorage.getItem('xf_me') || 'null'); } catch (e) {} renderAuth(); }
  route();
  if (tok) boot(fresh, true); else mark('auth');
}
async function boot(announce, first) {
  if (!first) render();
  try {
    me = (await api('init')).me; try { localStorage.setItem('xf_me', JSON.stringify(me)); } catch (e) {} renderAuth(); navOn(); if (view === 'home') drawHero();
    if (announce) toast('שלום, ' + String(me.name).split(' ')[0]);
    const c = $('#cmp');
    if (c && !c.innerHTML && me && (view !== 'channel' || cuid === me.uid) && view !== 'liked') c.innerHTML = cmpHtml();
    if (view === 'channel' && $('#hd') && chans.some(c => c.uid === cuid)) drawHd();
  } catch (e) {}
  if (first) mark('auth');
}
function renderAuth() {
  const el = $('#auth-area');
  $('#n-mine').style.display = me ? '' : 'none';
  if (me) el.innerHTML = `<div class="yt-user-chip" onclick="event.stopPropagation();$('#user-menu').classList.toggle('open')"><span class="yt-user-name">${x(me.name)}</span><div class="vav">${av(me)}</div></div>`;
  else el.innerHTML = `<button class="yt-login-btn" onclick="signIn()"><span class="g-dot"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></span><span class="lbl">התחבר עם Google</span></button>`;
}

/* ============ ROUTING ============ */
function go(v, u) {
  const h = v === 'channel' ? '#/c/' + u : '#/' + v;
  $('#user-menu').classList.remove('open'); 
  if (location.hash === h) route(); else location.hash = h;
}
function route() {
  const m = location.hash.match(/^#\/(\w+)(?:\/(\w+))?/) || [];
  view = m[1] === 'c' ? 'channel' : ['following', 'liked', 'channels'].includes(m[1]) ? m[1] : 'home';
  cuid = m[2] || null; q = ''; $('#search').value = '';
  navOn(); render();
}
function navOn() {
  const mine = view === 'channel' && me && cuid === me.uid;
  document.querySelectorAll('.nitem').forEach(n => n.classList.toggle('on', mine ? n.dataset.v === 'mine' : n.dataset.v === view));
}

/* ============ RENDER ============ */
const empty = (h, p, btn) => `<div class="empty"><h3>${h}</h3><p>${p}</p>${btn ? '<button class="sbtn sbtn-main" onclick="signIn()">התחבר עם Google</button>' : ''}</div>`;
const head = (t, s) => `<div class="feed-head"><h1>${t}</h1><p>${s}</p></div>`;
const match = p => !q || (p.text + ' ' + p.name).toLowerCase().includes(q);

async function render() {
  const my = ++rid, ct = $('#content'); posts = []; next = null; busy = false;
  if (!API) return mark('feed'), ct.innerHTML = empty('כמעט מוכן', 'הדבק את כתובת ה-Web App של האפסקריפט בקבוע <b>API</b> בראש הסקריפט בקובץ.');
  if ((view === 'following' || view === 'liked') && !tok) return mark('feed'), ct.innerHTML = empty('צריך להתחבר', view === 'liked' ? 'התחבר כדי לראות את הפוסטים שסימנת באהבתי.' : 'התחבר כדי לעקוב אחרי ערוצים ולראות את הפוסטים שלהם כאן.', true);
  if (view === 'channels') {
    ct.innerHTML = head('ערוצים', 'גלה ערוצים ועקוב אחריהם') + '<div class="cgrid" id="cg"><div class="skel"></div><div class="skel"></div></div>';
    try { await loadChans(); } catch (e) { mark('feed'); return; }
    if (my === rid) drawChans(); mark('feed'); return;
  }
  ct.innerHTML = (view === 'home' ? `<div class="home">${heroHtml()}` : '') + `<div class="feed"><div id="hd"></div><div id="cmp"></div><div id="feed-list"><div class="skel"></div><div class="skel"></div></div><div id="feed-end" class="feed-end"></div></div>` + (view === 'home' ? '</div>' : '');
  more(my, true);
  if (view === 'home') {
    drawHero();
    loadChans().then(() => { if (my === rid && view === 'home') { drawStats(); drawStrip(); } }).catch(() => { const h = $('#hch'); if (h) h.innerHTML = ''; });
  }
  if (view === 'channel') { try { await loadChans(); } catch (e) { mark('feed'); return; } if (my !== rid) return; drawHd(); }
  else $('#hd').innerHTML = head(...{ home: ['הפוסטים האחרונים', 'טרי מכל הערוצים'], following: ['פיד', 'פוסטים מערוצים שאתה עוקב אחריהם'], liked: ['אהבתי', 'פוסטים שסימנת בלב'] }[view]);
  if (me && (view !== 'channel' || cuid === me.uid) && view !== 'liked') $('#cmp').innerHTML = cmpHtml();
}

async function more(my, first) {
  if (busy) return; busy = true;
  const e = $('#feed-end');
  if (!first) e.innerHTML = '<div class="feed-spin"></div>';
  try {
    const r = await api('feed', { s: view === 'channel' ? 'user' : view, uid: cuid, before: next, limit: 8 });
    if (my !== rid) { if (first) mark('feed'); return; }
    if (first) { posts = []; $('#feed-list').innerHTML = ''; }
    posts.push(...r.posts); next = r.next;
    $('#feed-list').insertAdjacentHTML('beforeend', r.posts.filter(match).map(postHtml).join(''));
    if (first && view === 'home') drawTrend();
  } catch (err) { if (first && my === rid && !posts.length) $('#feed-list').innerHTML = ''; }
  busy = false; endState(); if (first) mark('feed');
}
function endState() {
  const e = $('#feed-end'); if (!e) return;
  if (io) io.disconnect();
  if (next) {
    e.innerHTML = '<div class="feed-spin"></div>';
    io = new IntersectionObserver(es => { if (es[0].isIntersecting && next && !busy) more(rid); }, { rootMargin: '800px 0px' });
    io.observe(e);
  } else e.textContent = posts.length ? 'זה הכל, הגעת לסוף הפיד' : ({ following: 'עדיין אין פוסטים. עקוב אחרי ערוצים כדי למלא את הפיד.', liked: 'עדיין לא סימנת פוסטים באהבתי.' }[view] || 'עדיין אין פוסטים כאן.');
}
function relist() { $('#feed-list').innerHTML = posts.filter(match).map(postHtml).join(''); }
function doSearch(v) { q = v.trim().toLowerCase(); if (view === 'channels') drawChans(); else if ($('#feed-list')) relist(); }

function postHtml(p) {
  const id = x(p.id), u = x(p.uid);
  return `<article class="fpost" data-id="${id}">
    <div class="fp-head"><div class="vav" onclick="go('channel','${u}')">${av(p)}</div>
      <div class="fp-who"><div class="fp-name" onclick="go('channel','${u}')">${x(p.name)}</div><div class="fp-time">${ago(p.createdAt)}${p.editedAt ? ' <span class="edtag">· נערך</span>' : ''}</div></div>
      ${(p.text || p.can) ? `<div class="pm-wrap"><button class="fbtn" onclick="pmenu(event,'${id}')" title="אפשרויות" aria-label="אפשרויות">${I.dots}</button><div class="pmenu">${p.text ? `<button onclick="copyPost('${id}')">${I.copy}<span>העתק טקסט</span></button>` : ''}${p.can ? `<button onclick="editPost('${id}')">${I.pen}<span>ערוך</span></button><button class="danger" onclick="delPost('${id}')">${I.trash}<span>מחק</span></button>` : ''}</div></div>` : ''}</div>
    ${p.text ? `<div class="fp-title">${fmt(p.text)}</div>` : ''}
    ${p.image ? `<div class="fmedia"><img src="${x(thumb(p.image))}" loading="lazy" alt=""></div>` : ''}
    ${p.video ? vidHtml(p.video) : ''}
    <div class="fp-actions"><button class="fbtn like-btn ${p.liked ? 'on' : ''}" onclick="like('${id}')" title="אהבתי" aria-label="אהבתי">${I.heart}</button><span class="lc">${p.likes || ''}</span><span class="sp"></span>
      <button class="fbtn" onclick="share('${u}')" title="העתק קישור לערוץ" aria-label="העתק קישור לערוץ">${I.share}</button></div>
  </article>`;
}

/* ============ TEXT FORMAT + VIDEO ============ */
/* עיצוב בסגנון וואטסאפ: *מודגש*  _נטוי_  ~קו חוצה~  וקישורים נלחצים */
function fmt(t) {
  const L = [];
  let s = x(t).replace(/https?:\/\/(?:(?!&lt;|&gt;|&quot;)\S)+/g, u => {
    const m = u.match(/[.,!?;:)]+$/), tail = m ? m[0] : '', core = tail ? u.slice(0, -tail.length) : u;
    L.push(core); return '\u0000' + (L.length - 1) + '\u0000' + tail;
  });
  const E = '(?=$|[\\s.,!?:;)\\u0000])';
  s = s.replace(new RegExp('(^|[\\s(])\\*([^*\\n]+?)\\*' + E, 'g'), '$1<b>$2</b>')
       .replace(new RegExp('(^|[\\s(])_([^_\\n]+?)_' + E, 'g'), '$1<i>$2</i>')
       .replace(new RegExp('(^|[\\s(])~([^~\\n]+?)~' + E, 'g'), '$1<s>$2</s>');
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<a href="${L[i]}" target="_blank" rel="noopener noreferrer nofollow">${L[i]}</a>`);
}
function wrapSel(btn, m) {
  const ta = btn.closest('.cmp,.edbox').querySelector('textarea'), v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
  if (a === b) { ta.value = v.slice(0, a) + m + m + v.slice(b); ta.setSelectionRange(a + 1, a + 1); }
  else if (v[a - 1] === m && v[b] === m) { ta.value = v.slice(0, a - 1) + v.slice(a, b) + v.slice(b + 1); ta.setSelectionRange(a - 1, b - 1); }
  else { ta.value = v.slice(0, a) + m + v.slice(a, b) + m + v.slice(b); ta.setSelectionRange(a + 1, b + 1); }
  ta.focus();
}
const fmtBar = () => `<span class="fmtb"><button type="button" class="fbtn tx" onmousedown="event.preventDefault()" onclick="wrapSel(this,'*')" title="מודגש" aria-label="מודגש">B</button><button type="button" class="fbtn tx" style="font-style:italic" onmousedown="event.preventDefault()" onclick="wrapSel(this,'_')" title="נטוי" aria-label="נטוי">I</button><button type="button" class="fbtn tx" style="text-decoration:line-through" onmousedown="event.preventDefault()" onclick="wrapSel(this,'~')" title="קו חוצה" aria-label="קו חוצה">S</button></span>`;
function vidInfo(u) {
  let U; try { U = new URL(u); } catch (e) { return null; }
  if (U.protocol !== 'https:') return null;
  const h = U.hostname.replace(/^(www\.|m\.)/, ''); let m;
  if (h === 'youtu.be') { m = U.pathname.match(/^\/([\w-]{11})/); if (m) return { t: 'yt', id: m[1] }; }
  if (h === 'youtube.com' || h === 'music.youtube.com') {
    m = U.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/); if (m) return { t: 'yt', id: m[1] };
    const v = U.searchParams.get('v'); if (U.pathname === '/watch' && v && /^[\w-]{11}$/.test(v)) return { t: 'yt', id: v };
  }
  if (h === 'drive.google.com') {
    m = U.pathname.match(/^\/file\/(?:u\/\d+\/)?d\/([\w-]+)/);
    const id = m ? m[1] : (U.pathname === '/open' || U.pathname === '/uc') ? U.searchParams.get('id') : null;
    if (id && /^[\w-]+$/.test(id)) return { t: 'drive', id };
  }
  if (/\.(mp4|webm)$/i.test(U.pathname)) return { t: 'mp4', u: U.href };
  return null;
}
function vidHtml(u) {
  const v = vidInfo(u);
  if (!v) return `<a class="vlink" href="${x(u)}" target="_blank" rel="noopener noreferrer nofollow">${x(u)}</a>`;
  if (v.t === 'mp4') return `<div class="fmedia vid"><video controls preload="metadata" playsinline src="${x(v.u)}"></video></div>`;
  return `<div class="fmedia vid vph ${v.t}" data-t="${v.t}" data-id="${x(v.id)}" onclick="playVid(this)">${v.t === 'yt' ? `<img src="https://i.ytimg.com/vi/${x(v.id)}/maxresdefault.jpg" data-id="${x(v.id)}" loading="lazy" alt="" onload="thumbFix(this)" onerror="thumbFix(this)">` : '<span class="vtag">Google Drive</span>'}<button class="vplay" aria-label="נגן סרטון">${I.play}</button></div>`;
}
/* תמונה ממוזערת באיכות הגבוהה ביותר שקיימת: maxres (1280px) -> sd (640px) -> hq (480px) */
function thumbFix(i) {
  const L = ['maxresdefault', 'sddefault', 'hqdefault'], n = +(i.dataset.n || 0);
  if (i.naturalWidth >= 320 || n + 1 >= L.length) return;
  i.dataset.n = n + 1; i.src = `https://i.ytimg.com/vi/${i.dataset.id}/${L[n + 1]}.jpg`;
}
function playVid(el) {
  const t = el.dataset.t, id = el.dataset.id;
  const src = t === 'yt' ? `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0` : `https://drive.google.com/file/d/${id}/preview`;
  el.classList.remove('vph'); el.onclick = null;
  el.innerHTML = `<iframe src="${src}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
}
function vidCheck(i) {
  const h = i.parentElement.querySelector('.vhint'), v = i.value.trim();
  if (!v) { h.textContent = ''; h.className = 'vhint'; return; }
  const r = vidInfo(v);
  h.textContent = r ? '✓ ' + { yt: 'סרטון YouTube', drive: 'סרטון Google Drive (יש לשתף את הקובץ "לכל מי שיש לו קישור")', mp4: 'קובץ וידאו' }[r.t] : 'הקישור לא נתמך (YouTube, Google Drive או קובץ mp4)';
  h.className = 'vhint ' + (r ? 'ok' : 'bad');
}
function toggleVid() { const r = $('#cvrow'); r.hidden = !r.hidden; if (!r.hidden) $('#cv').focus(); }
const VID_ERR = 'קישור הסרטון לא נתמך. אפשר YouTube, Google Drive או קובץ mp4';

/* ============ POSTS / LIKES ============ */
function cmpHtml() {
  return `<div class="fpost cmp"><div class="fp-head"><div class="vav">${av(me)}</div><div class="fp-who"><div class="fp-name" style="cursor:default">${x(me.name)}</div></div></div>
    <textarea id="ct" maxlength="2000" rows="3" placeholder="מה חדש?"></textarea>
    <div id="cvrow" class="vrow" hidden><input id="cv" dir="auto" maxlength="500" placeholder="קישור לסרטון: YouTube / Google Drive / קובץ mp4" oninput="vidCheck(this)" autocomplete="off"><div class="vhint"></div></div><div id="cprev"></div>
    <div class="fp-actions"><button class="fbtn" onclick="$('#cf').click()" title="הוסף תמונה" aria-label="הוסף תמונה">${I.img}</button><input type="file" id="cf" accept="image/*" hidden onchange="pickImg(this)"><button class="fbtn" onclick="toggleVid()" title="הוסף סרטון" aria-label="הוסף סרטון">${I.video}</button>${fmtBar()}<span class="sp"></span><button class="sbtn sbtn-main" id="cpost" onclick="publish()">פרסם</button></div></div>`;
}
async function upImg(f) {
  const fd = new FormData(); fd.append('file', f); fd.append('upload_preset', CLD.preset);
  const d = await (await fetch(`https://api.cloudinary.com/v1_1/${CLD.cloud}/image/upload`, { method: 'POST', body: fd })).json();
  if (!d.secure_url) throw 0; return d.secure_url;
}
async function pickImg(i) {
  const f = i.files[0]; i.value = ''; if (!f) return;
  if (!CLD.cloud || !CLD.preset) return toast('העלאת תמונות תוגדר בהמשך');
  $('#cprev').innerHTML = '<div class="feed-spin"></div>';
  try { img = await upImg(f); $('#cprev').innerHTML = `<div class="fmedia"><img src="${x(thumb(img))}" alt=""><button class="rm" onclick="img='';$('#cprev').innerHTML=''" aria-label="הסר">${I.x}</button></div>`; }
  catch (e) { $('#cprev').innerHTML = ''; toast('העלאת התמונה נכשלה'); }
}
async function publish() {
  const t = $('#ct').value.trim(), v = $('#cv').value.trim(); if (!t && !img && !v) return;
  if (v && !vidInfo(v)) return toast(VID_ERR);
  const b = $('#cpost'); b.disabled = true;
  try {
    const r = await api('post', { text: t, image: img, video: v });
    const p = { id: r.id, uid: me.uid, name: me.name, picture: me.picture, text: t, image: img, video: v, createdAt: r.createdAt, likes: 0, liked: false, mine: true, can: true };
    posts.unshift(p); $('#feed-list').insertAdjacentHTML('afterbegin', postHtml(p));
    $('#ct').value = ''; img = ''; $('#cv').value = ''; $('#cvrow').hidden = true; $('#cprev').innerHTML = ''; toast('הפוסט פורסם');
  } catch (e) {}
  b.disabled = false;
}
function closeMenus() { document.querySelectorAll('.pmenu.open').forEach(m => m.classList.remove('open')); }
function pmenu(e, id) {
  e.stopPropagation();
  const m = e.currentTarget.parentElement.querySelector('.pmenu'), was = m.classList.contains('open');
  closeMenus(); if (!was) m.classList.add('open');
}
async function copyPost(id) {
  closeMenus();
  const p = posts.find(p => p.id === id); if (!p || !p.text) return;
  try { await navigator.clipboard.writeText(p.text); }
  catch (e) { const t = document.createElement('textarea'); t.value = p.text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (er) {} t.remove(); }
  toast('הטקסט הועתק');
}
function editPost(id) {
  closeMenus();
  const p = posts.find(p => p.id === id), el = document.querySelector(`[data-id="${id}"]`);
  if (!p || !el || el.querySelector('.edbox')) return;
  const box = document.createElement('div'); box.className = 'edbox';
  box.innerHTML = `<textarea maxlength="2000"></textarea><div class="vrow" style="margin-top:8px"><input class="edv" dir="auto" maxlength="500" placeholder="קישור לסרטון (אופציונלי): YouTube / Google Drive / mp4" oninput="vidCheck(this)" autocomplete="off"><div class="vhint"></div></div><div class="edbar">${fmtBar()}<span class="sp"></span><button class="sbtn sbtn-main" onclick="saveEdit('${id}')">שמור</button><button class="sbtn" onclick="cancelEdit('${id}')">ביטול</button></div>`;
  const ta = box.querySelector('textarea'); ta.value = p.text || '';
  const ev = box.querySelector('.edv'); ev.value = p.video || '';
  const t = el.querySelector('.fp-title');
  if (t) { t.style.display = 'none'; t.after(box); } else el.querySelector('.fp-head').after(box);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function cancelEdit(id) {
  const el = document.querySelector(`[data-id="${id}"]`); if (!el) return;
  const b = el.querySelector('.edbox'); if (b) b.remove();
  const t = el.querySelector('.fp-title'); if (t) t.style.display = '';
}
async function saveEdit(id) {
  const p = posts.find(p => p.id === id), el = document.querySelector(`[data-id="${id}"]`); if (!p || !el) return;
  const text = el.querySelector('.edbox textarea').value.trim(), v = el.querySelector('.edv').value.trim();
  if (!text && !p.image && !v) return toast('הפוסט לא יכול להיות ריק');
  if (v && !vidInfo(v)) return toast(VID_ERR);
  if (text === (p.text || '') && v === (p.video || '')) return cancelEdit(id);
  const btn = el.querySelector('.edbar .sbtn-main'); btn.disabled = true;
  try {
    const r = await api('edit', { id, text, video: v });
    p.text = r.text; p.video = r.video !== undefined ? r.video : v; p.editedAt = r.editedAt;
    el.outerHTML = postHtml(p); toast('הפוסט עודכן');
  } catch (e) { btn.disabled = false; }
}
async function delPost(id) {
  closeMenus();
  if (!confirm('למחוק את הפוסט?')) return;
  try { await api('del', { id }); posts = posts.filter(p => p.id !== id); document.querySelector(`[data-id="${id}"]`).remove(); toast('הפוסט נמחק'); } catch (e) {}
}
function upd(p) { const el = document.querySelector(`[data-id="${p.id}"]`); if (!el) return; el.querySelector('.like-btn').classList.toggle('on', p.liked); el.querySelector('.lc').textContent = p.likes || ''; }
function setLike(p, on) { p.liked = on; p.likes = Math.max(0, (p.likes || 0) + (on ? 1 : -1)); upd(p); }
async function like(id) {
  if (!me) return toast('התחבר כדי לסמן אהבתי');
  const p = posts.find(p => p.id === id), on = !p.liked; setLike(p, on);
  try { p.likes = (await api('like', { id, on })).likes; upd(p); } catch (e) { setLike(p, !on); }
}
function share(u) {
  const url = location.href.split('#')[0] + '#/c/' + u;
  try { navigator.clipboard.writeText(url).then(() => toast('הקישור הועתק'), () => toast(url)); } catch (e) { toast(url); }
}

/* ============ CHANNELS ============ */
async function loadChans() { chans = (await api('channels')).channels; }
const folBtn = c => c.uid === (me && me.uid) ? '' : `<button class="sbtn ${c.following ? '' : 'sbtn-main'}" onclick="follow('${x(c.uid)}')">${c.following ? 'עוקב' : 'עקוב'}</button>`;
const stats = c => `${c.posts} פוסטים · ${c.followers} עוקבים`;
function drawChans() {
  const L = chans.filter(c => !q || (c.name + ' ' + c.bio).toLowerCase().includes(q));
  $('#cg').innerHTML = L.length ? L.map(c => `<div class="ccard"><div class="vav" onclick="go('channel','${x(c.uid)}')">${av(c)}</div>
    <div class="fp-who"><div class="fp-name" onclick="go('channel','${x(c.uid)}')">${x(c.name)}</div><div class="fp-time">${stats(c)}</div>${c.bio ? `<div class="cbio">${x(c.bio)}</div>` : ''}</div>${folBtn(c)}</div>`).join('') : '<div class="empty" style="grid-column:1/-1"><h3>לא נמצאו ערוצים</h3></div>';
}
function drawHd() {
  const c = chans.find(c => c.uid === cuid);
  if (!c) return $('#content').innerHTML = empty('הערוץ לא נמצא', 'ייתכן שהקישור שגוי.');
  $('#hd').innerHTML = `<div class="chead"><div class="vav">${av(c)}</div><div class="fp-who"><h1>${x(c.name)}</h1><div class="fp-time">${stats(c)}</div>${c.bio ? `<div class="cbio">${x(c.bio)}</div>` : ''}</div>${me && c.uid === me.uid ? '<button class="sbtn" onclick="editProf()">עריכה</button>' : folBtn(c)}</div>`;
}
const redraw = () => view === 'channels' ? drawChans() : view === 'home' ? drawStrip() : drawHd();
async function follow(uid) {
  if (!me) return toast('התחבר כדי לעקוב אחרי ערוצים');
  const c = chans.find(c => c.uid === uid), on = !c.following;
  c.following = on; c.followers += on ? 1 : -1; redraw();
  try { await api('follow', { uid, on }); } catch (e) { c.following = !on; c.followers += on ? -1 : 1; redraw(); }
}
function editProf() {
  $('#user-menu').classList.remove('open');
  const c = chans.find(c => c.uid === me.uid) || me;
  $('#pn').value = me.name; $('#pb').value = c.bio || ''; $('#pm').classList.add('open');
}
async function saveProf() {
  try {
    me = (await api('profile', { name: $('#pn').value, bio: $('#pb').value })).me;
    try { localStorage.setItem('xf_me', JSON.stringify(me)); } catch (e) {} $('#pm').classList.remove('open'); renderAuth(); toast('הערוץ עודכן'); render();
  } catch (e) {}
}

/* ============ HOME ============ */
const greet = () => { const h = new Date().getHours(); return h < 5 ? 'לילה טוב' : h < 12 ? 'בוקר טוב' : h < 17 ? 'צהריים טובים' : h < 21 ? 'ערב טוב' : 'לילה טוב'; };
const skels = '<div class="hscroll"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
function heroHtml() {
  return `<section class="hero"><div class="hero-bg"><i></i><i></i><i></i></div><div id="hmain"></div>
    <div id="hstats" class="hstats"><div><b>–</b><span>ערוצים</span></div><div><b>–</b><span>פוסטים</span></div><div><b>–</b><span>עוקבים</span></div></div></section>
    <div id="hch">${skels}</div><div id="htr"></div>`;
}
function drawHero() {
  const e = $('#hmain'); if (!e) return;
  const n = me ? x(String(me.name).split(' ')[0]) : '';
  e.innerHTML = `<div class="hpill"><span class="hdot"></span>הפלטפורמה פעילה</div>
    <h1>${me ? `${greet()}, <em>${n}</em>` : 'כל מה שחדש,<br><em>במקום אחד</em>'}</h1>
    <p class="hsub">${me ? 'מה בא לך לשתף היום? כתוב פוסט, גלה ערוצים חדשים ותראה מה קורה אצל מי שאתה עוקב אחריו.' : 'שתף רגעים, עקוב אחרי ערוצים שאתה אוהב וגלה אנשים חדשים. התחברות אחת עם Google, וזהו.'}</p>
    <div class="hcta">${me ? '<button class="sbtn sbtn-main" onclick="focusCmp()">כתוב פוסט</button>' : '<button class="sbtn sbtn-main" onclick="signIn()">התחבר עם Google</button>'}<button class="sbtn" onclick="go('channels')">גלה ערוצים</button></div>`;
}
function focusCmp() { const c = $('#ct'); if (!c) return; c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.focus({ preventScroll: true }); }
function countUp(el, n) {
  const t0 = performance.now(), d = 900;
  (function f(t) { const p = Math.min(1, (t - t0) / d); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString('he-IL'); if (p < 1) requestAnimationFrame(f); })(t0);
}
function drawStats() {
  const hs = $('#hstats'); if (!hs) return;
  const tp = chans.reduce((s, c) => s + (c.posts || 0), 0), tf = chans.reduce((s, c) => s + (c.followers || 0), 0);
  hs.innerHTML = [[chans.length, 'ערוצים'], [tp, 'פוסטים'], [tf, 'עוקבים']].map(([n, l]) => `<div><b>0</b><span>${l}</span></div>`).join('');
  hs.querySelectorAll('b').forEach((b, i) => countUp(b, [chans.length, tp, tf][i]));
}
const hchCard = c => `<div class="hch"><div class="vav" onclick="go('channel','${x(c.uid)}')">${av(c)}</div><div class="fp-name" onclick="go('channel','${x(c.uid)}')">${x(c.name)}</div><div class="fp-time">${stats(c)}</div>${c.bio ? `<div class="cbio">${x(c.bio)}</div>` : ''}${folBtn(c)}</div>`;
function drawStrip() {
  const hc = $('#hch'); if (!hc) return;
  const old = hc.querySelector('.hscroll'), sl = old ? old.scrollLeft : 0;
  const L = [...chans].sort((a, b) => (b.followers - a.followers) || (b.posts - a.posts)).slice(0, 10);
  hc.innerHTML = L.length ? `<div class="sec-h"><h2>ערוצים מומלצים</h2><a onclick="go('channels')">לכל הערוצים ←</a></div><div class="hscroll">${L.map(hchCard).join('')}</div>` : '';
  const ns = hc.querySelector('.hscroll'); if (ns) ns.scrollLeft = sl;
}
function drawTrend() {
  const e = $('#htr'); if (!e) return;
  const T = posts.filter(p => p.likes > 0 && p.text).sort((a, b) => b.likes - a.likes).slice(0, 3);
  e.innerHTML = T.length ? `<div class="sec-h"><h2>אהובים עכשיו</h2></div><div class="trend">${T.map(p => `<div class="tcard" onclick="jump('${x(p.id)}')"><div class="tl">♥ ${p.likes}</div><div class="tt">${x(p.text)}</div><div class="fp-time">${x(p.name)}</div></div>`).join('')}</div>` : '';
}
function jump(id) { const el = document.querySelector(`[data-id="${id}"]`); if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }

/* ============ INIT ============ */
$('#theme-btn').onclick = () => { document.body.className = document.body.classList.contains('dark') ? 'light' : 'dark'; localStorage.setItem('xf_theme', document.body.className); };
document.addEventListener('click', e => {
  if (!e.target.closest('#user-menu') && !e.target.closest('#auth-area')) $('#user-menu').classList.remove('open');
});
$('#pm').onclick = e => { if (e.target.id === 'pm') e.target.classList.remove('open'); };
addEventListener('hashchange', route);
document.addEventListener('click', closeMenus);
if (!window.__xfFrame) { renderAuth(); start(); }
</script>
